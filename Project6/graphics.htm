<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extreme Honeymoons - Graphics</title>

<style type="text/css">

body {
	background-color: #F1DEA7;
	font-family: Arial, Helvetica, sans-serif;
	color: #042640;
	margin: 20px;
}

h1, h2 {
	color: #042640;
	text-align: center;
}

.rollover-container {
	text-align: center;
	margin: 20px auto;
}

.rollover-container img {
	border: none;
	vertical-align: middle;
}

#thumbs, #image {
	width: 700px; 
	border: solid 1px #AA8E39; 
	text-align: center; 
	margin: 0 auto 0 auto; 
	color: #000; 
	background: #FFFFFF; 
	padding: 5px;
}

#thumbs {
	margin-top: 10px;
}


#thumbs img {
	border: solid 1px #000; 
	margin: 5px;
}

#image{
	height:400px;
}

.instructions{
	font-style:italic;
}


</style>

<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "images/print5.gif"
	PrintButton2.src = "images/print6.gif"
	logo1.src = "images/logo1.jpg"
	logo2.src = "images/logo2.jpg"
}


		var imgArray = new Array(
			'Image1Lg.jpg',
			'Image2Lg.jpg',
			'Image3Lg.jpg',
			'Image4Lg.jpg'
			

		);


		var titleArray = new Array(
			'Hunting',
			'Biking',
			'Laughing',
			'Skiing'
			
		);
			
		var imgPath = "Images/Fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">

<div align="center">

<div>
	<a href="" onmouseover="document.getElementById('print').src='images/Print2.jpg';" 	onmouseout="document.getElementById('print').src='Images/print1.jpg';">
	<img src="images/Print1.jpg" alt="Print Page" width="200" height="50" id="print"></a>


	</a>
</div>


<div id="logo">
	<a href="logo.html" onMouseOver="document.logo.src=logo2.src;"
	onMouseOut="document.logo.src=logo1.src;">

	<img src="images/logo1.jpg" width="133" height="126" 
	name="logo" alt="logo" style="border:none;"/>

	</a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">
		<img src="Images/Thumbnails/Image1Sm.jpg" alt="Couple Hunting" onmouseover="swapImage(0);" />
		<img src="Images/Thumbnails/Image2Sm.jpg" alt="Couple Bike Riding" onmouseover="swapImage(1);" />
		<img src="Images/Thumbnails/Image3Sm.jpg" alt="Couple Laughing" onmouseover="swapImage(2);" />
		<img src="Images/Thumbnails/Image4Sm.jpg" alt="Couple Skiing" onmouseover="swapImage(3);" />
		
</div>

	<div id="image">

		<img id="theImage" src="Images/FullSize/Image1Lg.jpg" alt="Couple Hunting" />
		<h3 id="bottomText">Hunting</h3>
	</div>

<img src="images/2colback.jpg">

<br />
<br />
<br />
<br />



</div>

<p>

      src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
</p>
  

</body>
</html>
